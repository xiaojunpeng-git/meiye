# 仅本机体验入口；平台页面来自固定18081开发源，API与媒体使用隔离本地实例。
server {
    listen 80;
    server_name localhost;
    client_max_body_size 50m;
    location /adminapi/ { proxy_pass http://mohe-growth-local-app:20700; proxy_set_header Host $http_host; proxy_read_timeout 120s; }
    location /api/ { proxy_pass http://mohe-growth-local-app:20700; proxy_set_header Host $http_host; proxy_read_timeout 120s; }
    location / { proxy_pass http://growth-admin-source:8081; proxy_set_header Host localhost:18081; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}
