<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航组间距本地验证</title>
<style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f1f3f5;color:#262a31;font:14px system-ui}main{padding:20px;max-width:920px;margin:auto}h1{font-size:20px;margin:0 0 20px}h2{font-size:14px;margin:16px 0 8px}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}label{display:flex;gap:8px;align-items:center}input{width:68px;padding:7px;border:1px solid #b9bec7;border-radius:4px}button{padding:7px 12px;border:1px solid #b9bec7;background:white;border-radius:4px}.comparison{display:flex;gap:24px;flex-wrap:wrap}.column{width:375px;max-width:100%}.phone{width:375px;max-width:100%;min-height:210px;background:#e9edf1;overflow:auto;padding-top:12px}.product-reference{height:66px;background:white;margin-top:12px;padding:12px}.member view{display:block;box-sizing:border-box}.member .menu{display:grid;grid-template-rows:auto;grid-row-gap:calc(24 * var(--rpx));width:100%;padding:calc(20 * var(--rpx)) 0}.member .flex-col{display:flex;flex-direction:column}.member .flex-center{align-items:center;justify-content:center}.member .fs-24{font-size:calc(24 * var(--rpx))}.member .mt-14{margin-top:calc(14 * var(--rpx))}.member img{display:block}.member .dot{display:none}p{margin:0}.status{margin-top:12px;min-height:20px}#app[v-cloak]{display:none}@media(max-width:500px){main{padding:12px}.controls{gap:12px}.comparison{gap:4px}}
.member uni-view{display:block;box-sizing:border-box}
</style>
<main id="app" v-cloak>
<h1>导航组间距本地验证</h1>
<div class="controls">
  <label>{{config.prConfig.title}}<input aria-label="左右内边距" type="number" min="0" max="100" v-model.number="config.prConfig.val"></label>
  <label>{{config.outerMarginConfig.title}}<input aria-label="左右外边距" type="number" min="0" max="100" v-model.number="config.outerMarginConfig.val"></label>
  <button @click="saveDraft">保存测试草稿</button>
</div>
<div class="comparison">
  <section class="column"><h2>编辑器预览</h2><div class="phone editor"><navigation-preview :num="0"></navigation-preview><div class="product-reference" style="margin-left:10px;margin-right:10px">商品列表对齐参考</div></div></section>
  <section class="column"><h2>会员端 H5 布局</h2><div ref="memberPhone" class="phone member" :style="{'--rpx':memberWidth/750+'px'}"><navigation-member :data-config="config"></navigation-member><div class="product-reference" :style="{marginLeft:memberWidth/375*10+'px',marginRight:memberWidth/375*10+'px'}">商品列表对齐参考</div></div></section>
</div><p class="status">{{status}}</p>
</main>
<script src="/vue.js"></script><script src="/source.js"></script>
<script>
// This adapter supplies uni-app tags/rpx and test-only store/storage. Both
// navigation templates and all spacing decisions come from canonical SFCs.
const mapState=()=>({defaultArray(){return this.$store.state.admin.mobildConfig.defaultArray;}});
const tools=new Proxy({}, {get:(_,name)=>({name})});
function component(source){const o=new Function('mapState','toolCom','rightBtn',source.script)(mapState,tools,{});const template=source.template.replace(/(<\/?)view(?=[\s>])/g,'$1uni-view');return Object.assign(o,Vue.compile(template));}
const preview=component(fixtureSources.preview),member=component(fixtureSources.member),settings=component(fixtureSources.settings);
const store=Vue.observable({state:{admin:{mobildConfig:{defaultArray:{0:fixtureSources.config}}}}});
const draft={ $store:store };settings.methods.loadConfig.call(draft,0);
let data=draft.configObj;
const saved=localStorage.getItem('diy-menu-spacing-synthetic-draft');
if(saved)data=JSON.parse(saved);
store.state.admin.mobildConfig.defaultArray={0:data};
Vue.prototype.$store=store;
Vue.prototype.$util={JumpPath(url){document.querySelector('.status').textContent=url;}};
Vue.component('easy-loadimage',{props:['imageSrc','width','height','borderRadius'],computed:{imageStyle(){const px=v=>parseFloat(v)*this.$root.memberWidth/750+'px';return{width:px(this.width),height:px(this.height),borderRadius:this.borderRadius};}},template:'<img :src="imageSrc" :style="imageStyle" alt="">'});
// Real H5 compilation converts rpx to viewport-relative pixels. Limit this
// fixture adapter to style objects; do not replace the component's logic.
for(const key of ['boxStyle','boxContentStyle','imgStyle']){const original=member.computed[key];member.computed[key]=function(){const ratio=this.$root.memberWidth/750;const convert=v=>typeof v==='string'?v.replace(/(-?[\d.]+)rpx/g,(_,n)=>Number(n)*ratio+'px'):Object.fromEntries(Object.entries(v).map(([k,n])=>[k,convert(n)]));return convert(original.call(this));};}
Vue.component('navigation-preview',preview);Vue.component('navigation-member',member);
new Vue({el:'#app',data:{config:data,memberWidth:375,status:''},mounted(){this.measure();this.resize=new ResizeObserver(this.measure);this.resize.observe(this.$refs.memberPhone);},methods:{measure(){this.memberWidth=this.$refs.memberPhone.clientWidth;},saveDraft(){localStorage.setItem('diy-menu-spacing-synthetic-draft',JSON.stringify(this.config));this.status='测试草稿已保存';}}});
</script></html>
